<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SamFit diagnostiikka</title><style>body{font:18px system-ui;background:#f0f6ff;color:#18324b;padding:22px}button,input{font:inherit;padding:14px;margin:8px 0;border-radius:10px}button{background:#1464b8;color:white;border:0;display:block}section{background:white;padding:20px;border-radius:16px;max-width:600px}#status{white-space:pre-wrap}</style></head><body><section><h1>SamFit – toimintatesti</h1><p>Testi ei lähetä eikä tallenna tietoja.</p><p id="status">HTML avautui. JavaScriptin tilaa tarkistetaan…</p><button id="tap" onclick="document.getElementById('status').textContent='PAINIKE TOIMII – JavaScript reagoi.'">1. Testaa painike</button><label>2. Valitse ICS-tiedosto<input id="file" type="file" accept=".ics,text/calendar"></label><p id="result"></p></section><script>document.getElementById('status').textContent='JavaScript käynnistyi. Paina testipainiketta.';document.getElementById('file').addEventListener('change',function(){var f=this.files&&this.files[0];if(!f)return;document.getElementById('result').textContent='Valittu: '+f.name+' – luetaan…';var r=new FileReader();r.onload=function(){var s=String(r.result||'');document.getElementById('result').textContent='Tiedosto luettu: '+s.length+' merkkiä, VEVENT-tapahtumia '+(s.match(/BEGIN:VEVENT/g)||[]).length+'.'};r.onerror=function(){document.getElementById('result').textContent='Tiedoston luku epäonnistui.'};r.readAsText(f)});</script></body></html>
